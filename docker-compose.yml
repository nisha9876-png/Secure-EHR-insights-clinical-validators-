services:
  db:
    image: pgvector/pgvector:pg14
    container_name: ehr-postgres
    environment:
      POSTGRES_USER: ehr_user
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: hospital_db
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata: